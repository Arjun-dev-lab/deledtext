<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.El.Ed Textbooks Portal</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 90%;
            margin: 2.5rem auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: var(--text);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary);
        }

        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .card h3 {
            font-size: 1.25rem;
            color: var(--primary);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #e2e8f0;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>D.El.Ed Textbooks Portal</h1>
        <p>Select your Medium / Language to access study materials</p>
    </header>

    <main>
        <h2 class="section-title">Select Medium / State</h2>
        <div class="grid">
            <a href="years.html?medium=odisha" class="card">
                <div class="icon">🏛️</div>
                <h3>Odisha (Odia Medium)</h3>
            </a>
            
            <a href="years.html?medium=english" class="card">
                <div class="icon">📚</div>
                <h3>English Medium</h3>
            </a>

            <a href="years.html?medium=hindi" class="card">
                <div class="icon">📖</div>
                <h3>Hindi Medium</h3>
            </a>

            <a href="years.html?medium=sanskrit" class="card">
                <div class="icon">📜</div>
                <h3>Sanskrit Medium</h3>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; D.El.Ed Student Resource Portal</p>
    </footer>

</body>
</html>
